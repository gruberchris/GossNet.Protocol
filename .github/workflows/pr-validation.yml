name: PR Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Important for GitVersion

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # The SDK that builds the repo comes from global.json, so it never
          # drifts from what developers use locally. The extra 8.0.x install
          # provides the .NET 8 runtime so the net8.0 test target is exercised
          # on its own runtime rather than rolling forward.
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Display Version
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"

      - name: Build
        run: dotnet build --configuration Release /p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Test
        run: dotnet test --configuration Release --no-build

      # Packaging is part of this library's contract, so a PR that breaks the
      # package (missing TFM asset, bad dependency group) should fail here
      # rather than at release time.
      - name: Pack
        run: dotnet pack --configuration Release --no-build /p:Version=${{ steps.gitversion.outputs.semVer }} --output ./artifacts

      - name: Verify package contents
        run: |
          set -euo pipefail

          check() {
            local id="$1"; shift
            local nupkg
            nupkg=$(ls ./artifacts/$id.[0-9]*.nupkg)
            echo "Inspecting $nupkg"
            for tfm in "$@"; do
              if ! unzip -l "$nupkg" | grep -q "lib/$tfm/$id.dll"; then
                echo "::error::$id is missing the $tfm assembly"
                exit 1
              fi
              echo "  found lib/$tfm/$id.dll"
            done
          }

          check GossNet.Protocol netstandard2.0 net8.0 net10.0
          check GossNet.Discovery.Consul netstandard2.0 net8.0 net10.0

          # The whole point of shipping discovery providers separately is that their
          # dependencies stay out of the core package.
          core_nuspec=$(unzip -p ./artifacts/GossNet.Protocol.[0-9]*.nupkg '*.nuspec')
          for forbidden in Consul KubernetesClient Docker.DotNet; do
            if echo "$core_nuspec" | grep -q "id=\"$forbidden\""; then
              echo "::error::GossNet.Protocol must not depend on $forbidden"
              exit 1
            fi
          done
          echo "  core package carries no provider dependencies"
