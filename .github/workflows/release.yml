name: Release

permissions:
  contents: write # gh release create
  packages: write # GitHub Packages push
  id-token: write # OIDC token for nuget.org Trusted Publishing

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Important for GitVersion
          # Check the branch out attached rather than at a detached SHA. With a
          # detached HEAD, GitVersion has to guess which branch a commit belongs
          # to by searching every branch that contains it, and picks the wrong
          # one -- which produced a prerelease version (0.1.18-2) on main.
          ref: ${{ github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # SDK from global.json; the extra 8.0.x install provides the .NET 8
          # runtime the net8.0 test target needs.
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Display Version
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"

      # A build of main must produce a clean release version. If a prerelease tag
      # appears here, GitVersion resolved the branch incorrectly and the version
      # is wrong -- fail before anything is published rather than shipping it.
      - name: Guard against prerelease version on main
        run: |
          set -euo pipefail
          tag='${{ steps.gitversion.outputs.preReleaseTag }}'
          if [ -n "$tag" ]; then
            echo "::error::Refusing to release: main resolved to prerelease version ${{ steps.gitversion.outputs.semVer }} (preReleaseTag='$tag')."
            exit 1
          fi
          echo "Release version ${{ steps.gitversion.outputs.semVer }} is clean."

      - name: Build
        run: dotnet build --configuration Release /p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack --configuration Release --no-build /p:Version=${{ steps.gitversion.outputs.semVer }} --output ./artifacts

      # Packaging is part of this library's contract, and a published package cannot be
      # unpublished. The same check runs in pr-validation, but only here does it stand
      # between a broken package (missing TFM asset, leaked provider dependency) and
      # nuget.org.
      - name: Verify package contents
        run: |
          set -euo pipefail

          check() {
            local id="$1"; shift
            local nupkg
            nupkg=$(ls ./artifacts/$id.[0-9]*.nupkg)
            echo "Inspecting $nupkg"
            for tfm in "$@"; do
              if ! unzip -l "$nupkg" | grep -q "lib/$tfm/$id.dll"; then
                echo "::error::$id is missing the $tfm assembly"
                exit 1
              fi
              echo "  found lib/$tfm/$id.dll"
            done
          }

          check GossNet.Protocol netstandard2.0 net8.0 net10.0
          check GossNet.Discovery.Aws netstandard2.0 net8.0 net10.0
          check GossNet.Discovery.Azure netstandard2.0 net8.0 net10.0
          check GossNet.Discovery.Consul netstandard2.0 net8.0 net10.0
          check GossNet.Discovery.Docker netstandard2.0 net8.0 net10.0
          check GossNet.Discovery.Gcp netstandard2.0 net8.0 net10.0
          check GossNet.Discovery.Redis netstandard2.0 net8.0 net10.0
          # Kubernetes and etcd deliberately have a narrower set: neither KubernetesClient
          # nor dotnet-etcd ships a netstandard2.0 asset, which is part of why these
          # providers are separate packages rather than built in.
          check GossNet.Discovery.Kubernetes net8.0 net10.0
          check GossNet.Discovery.Etcd net8.0 net10.0

          # The whole point of shipping discovery providers separately is that their
          # dependencies stay out of the core package.
          core_nuspec=$(unzip -p ./artifacts/GossNet.Protocol.[0-9]*.nupkg '*.nuspec')
          for forbidden in Consul KubernetesClient Docker.DotNet AWSSDK.EC2 StackExchange.Redis dotnet-etcd Azure.Identity Google.Cloud.Compute.V1; do
            if echo "$core_nuspec" | grep -q "id=\"$forbidden\""; then
              echo "::error::GossNet.Protocol must not depend on $forbidden"
              exit 1
            fi
          done
          echo "  core package carries no provider dependencies"

      # Package pushes come BEFORE the GitHub release is created. The previous
      # order created the release first, so when the nuget.org push failed the
      # repo was left with tags/releases (v0.1.17, v0.1.18) advertising versions
      # that were never actually published. Publishing first means a tag only
      # ever exists for a version that really shipped.
      #
      # --skip-duplicate covers the symbol package too; pushing the .nupkg
      # alongside its .snupkg is what makes SourceLink step-through work for
      # consumers debugging into the library.

      # Trusted Publishing: exchange this job's GitHub OIDC token for a temporary
      # nuget.org API key. Replaces the long-lived NUGET_API_KEY secret, whose
      # expiry silently broke every release from 2026-08-16 onwards with a 403.
      #
      # The key lives for one hour, so this step sits immediately before the push
      # rather than at the top of the job.
      #
      # `user` is the nuget.org profile name, NOT an email address. It is already
      # public as the package owner; move it to a secret if you would rather it
      # not appear here.
      - name: Get a short-lived NuGet API key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: gruberchris

      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push to GitHub Packages
        run: |
          # Remove the source if it exists, then add it
          dotnet nuget remove source github || true
          dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          # Push package. GitHub Packages rejects symbol packages, so unlike the
          # nuget.org push above this one opts out of the automatic .snupkg upload.
          dotnet nuget push "./artifacts/*.nupkg" --source github --skip-duplicate --no-symbols

      - name: Create Release and Upload Asset
        run: |
          set -euo pipefail
          gh release create v${{ steps.gitversion.outputs.majorMinorPatch }} \
            --title "Release v${{ steps.gitversion.outputs.majorMinorPatch }}" \
            --generate-notes

          # Every package in the repo, not just the core one: the discovery providers
          # ship as their own packages.
          gh release upload v${{ steps.gitversion.outputs.majorMinorPatch }} \
            ./artifacts/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
