# GitVersion 6 configuration.
#
# Migrated from the v5 schema, which v6 rejects outright:
#   * `mode: Mainline` is no longer a mode -- mainline is now a versioning
#     *strategy*, and `mode` selects the deployment model instead.
#   * `tag:` was renamed to `label:`.
#   * `prevent-increment-of-merged-branch-version:` moved under `prevent-increment:`.
#
# Deployment mode is set per-branch below rather than globally, because main and
# feature branches want opposite behaviour. This root value only applies to
# branches that match nothing else.
mode: ContinuousDelivery

# The root increment is the fallback used when no branch configuration matches
# (an unmatched branch name, or a detached HEAD where no branch can be resolved).
# It must be a concrete value: the default `Inherit` has nothing to inherit from
# and makes the Mainline strategy throw outright --
# "Specified argument was out of the range of valid values. (Parameter 'strategy')".
increment: Patch

strategies:
  - Mainline
  - MergeMessage
  - TaggedCommit
  - VersionInBranchName

branches:
  main:
    regex: ^master$|^main$
    # ContinuousDeployment is the GitVersion 6 equivalent of the v5 `mode: Mainline`
    # this repo used: every commit on main is a releasable version with no
    # prerelease label. ContinuousDelivery (the v6 default) instead numbers the
    # commits since the last tag, which is what produced 0.1.19-2 on main and
    # blocked the release.
    mode: ContinuousDeployment
    label: ''
    increment: Patch
    prevent-increment:
      of-merged-branch: true
    track-merge-target: false
    tracks-release-branches: false
    is-release-branch: true

  # Widened from the v5 `^features?[/-]` so the conventional-commit branch
  # prefixes this repo actually uses (feat/, fix/, chore/, docs/, refactor/,
  # test/, perf/) all resolve to a prerelease version during PR validation.
  # Without this they fall through to the fallback config and PR builds get an
  # unlabelled version indistinguishable from a release build.
  feature:
    regex: ^features?[/-]|^fix[/-]|^chore[/-]|^docs?[/-]|^refactor[/-]|^tests?[/-]|^perf[/-]
    # Feature branches keep ContinuousDelivery so PR builds stay clearly labelled
    # prereleases (0.1.19-alpha.1) and can never be mistaken for a release.
    mode: ContinuousDelivery
    label: alpha
    increment: Patch
    source-branches:
      - main
    prevent-increment:
      of-merged-branch: false
    track-merge-target: false
    tracks-release-branches: false
    is-release-branch: false

ignore:
  sha: []
merge-message-formats: {}

# Version-bump markers must start a line.
#
# GitVersion's defaults match the marker ANYWHERE in a commit message, so merely
# describing one in prose silently bumps the version. That is not hypothetical:
# the commit that fixed the deployment mode included a verification table with a
# row mentioning the minor marker inline, and GitVersion took it literally --
# releasing a CI-only fix as 0.2.0 instead of 0.1.19.
#
# The (?m) inline flag makes ^ match the start of any line rather than the start
# of the whole message, so a marker on its own line in the commit body still
# works while an inline mention in prose does not. Plain ^ is NOT sufficient:
# without (?m) it anchors to the start of the entire message, which breaks
# legitimate markers since they conventionally live in the body.
major-version-bump-message: '(?m)^\+semver:\s?(breaking|major)'
minor-version-bump-message: '(?m)^\+semver:\s?(feature|minor)'
patch-version-bump-message: '(?m)^\+semver:\s?(fix|patch)'
no-bump-message: '(?m)^\+semver:\s?(none|skip)'
